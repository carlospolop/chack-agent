name: Update Copilot Models

on:
  schedule:
    - cron: "27 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-models:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Install Copilot CLI
        run: brew install --cask copilot-cli

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update copilot models list
        run: python scripts/update_copilot_models.py

      - name: Commit updated models
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chack_agent/config/copilot_models.json
          if git diff --cached --quiet; then
            echo "No copilot model changes detected"
            exit 0
          fi
          git commit -m "chore: update Copilot CLI model list"
          git push origin HEAD:master
