name: Run Chack Agent

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Model provider: openai, openrouter, codex, gemini or langgraph"
        required: true
        default: "openai"
      model_primary:
        description: "Primary model (e.g., gpt-4o, google/gemini-3-pro-preview)"
        required: true
        default: "gpt-5.2"
      model_social_network:
        description: "Social network model (optional)"
        required: false
        default: "CHEAP_BUT_QUALITY"
      model_scientific:
        description: "Scientific model (optional)"
        required: false
        default: "CHEAP_BUT_QUALITY"
      model_websearcher:
        description: "Websearcher model (optional)"
        required: false
        default: "CHEAP_BUT_QUALITY"
      model_tester:
        description: "Tester model (optional)"
        required: false
        default: "CHEAP_BUT_QUALITY"
      system_prompt:
        description: "System prompt"
        required: true
        default: "You are an advanced research agent."
      user_prompt:
        description: "User prompt"
        required: true
      main_action:
        description: "Agent main_action"
        required: true
        default: "github_action"
      sub_action:
        description: "Agent sub_action"
        required: true
        default: "run"
      tools_config_json:
        description: "JSON dict for ToolsConfig overrides"
        required: false
        default: "{\"exec_enabled\": true}"
      session_config_json:
        description: "JSON dict for SessionConfig overrides"
        required: false
        default: "{}"
      agent_config_json:
        description: "JSON dict for AgentConfig overrides"
        required: false
        default: "{}"
      logging_level:
        description: "Logging level"
        required: false
        default: "INFO"
      max_turns:
        description: "Session max_turns override (0 to keep default)"
        required: false
        default: "100"

jobs:
  run-agent:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_HTTP_REFERER: ${{ secrets.OPENROUTER_HTTP_REFERER }}
      OPENROUTER_APP_NAME: ${{ secrets.OPENROUTER_APP_NAME }}
      OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run Chack Agent
        id: run
        env:
          INPUT_PROVIDER: ${{ inputs.provider }}
          INPUT_MODEL_PRIMARY: ${{ inputs.model_primary }}
          INPUT_MODEL_SOCIAL: ${{ inputs.model_social_network }}
          INPUT_MODEL_SCIENTIFIC: ${{ inputs.model_scientific }}
          INPUT_MODEL_WEBSEARCHER: ${{ inputs.model_websearcher }}
          INPUT_MODEL_TESTER: ${{ inputs.model_tester }}
          INPUT_SYSTEM_PROMPT: ${{ inputs.system_prompt }}
          INPUT_USER_PROMPT: ${{ inputs.user_prompt }}
          INPUT_MAIN_ACTION: ${{ inputs.main_action }}
          INPUT_SUB_ACTION: ${{ inputs.sub_action }}
          INPUT_TOOLS_CONFIG_JSON: ${{ inputs.tools_config_json }}
          INPUT_SESSION_CONFIG_JSON: ${{ inputs.session_config_json }}
          INPUT_AGENT_CONFIG_JSON: ${{ inputs.agent_config_json }}
          INPUT_LOGGING_LEVEL: ${{ inputs.logging_level }}
          INPUT_MAX_TURNS: ${{ inputs.max_turns }}
          INPUT_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          INPUT_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          INPUT_OPENROUTER_HTTP_REFERER: ${{ secrets.OPENROUTER_HTTP_REFERER }}
          INPUT_OPENROUTER_APP_NAME: ${{ secrets.OPENROUTER_APP_NAME }}
          INPUT_OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL }}
          INPUT_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INPUT_GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          python -m chack_agent.github_action

      - name: Show Agent Output
        run: |
          echo "=== AGENT OUTPUT ==="
          echo "${{ steps.run.outputs.final-message }}"
