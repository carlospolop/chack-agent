name: "chack-agent"
description: "Run the chack agent with a prompt and parameters."
inputs:
  provider:
    description: "Model provider: openai, openrouter, codex, gemini, claude, or langgraph"
    required: false
    default: "openrouter"
  model_primary:
    description: "Primary model (e.g., gpt-4o, gpt-5.2-codex)"
    required: false
    default: "BEST_QUALITY"
  model_social_network:
    description: "Social network model (optional)"
    required: false
    default: "CHEAP_BUT_QUALITY"
  model_scientific:
    description: "Scientific model (optional)"
    required: false
    default: "CHEAP_BUT_QUALITY"
  model_websearcher:
    description: "Websearcher model (optional)"
    required: false
    default: "CHEAP_BUT_QUALITY"
  model_tester:
    description: "Tester model (optional)"
    required: false
    default: "CHEAP_BUT_QUALITY"
  system_prompt:
    description: "System prompt"
    required: false
    default: "You are an advanced research agent."
  user_prompt:
    description: "User prompt (ignored if prompt_file is provided)"
    required: false
    default: ""
  prompt_file:
    description: "Path to a prompt file (relative to the repo workspace)"
    required: false
    default: ""
  output_schema_file:
    description: "Path to a JSON schema file (relative to the repo workspace)"
    required: false
    default: ""
  output_schema_json:
    description: "Inline JSON schema (string)"
    required: false
    default: ""
  output_schema_name:
    description: "Name for the output schema"
    required: false
    default: "output_schema"
  output_schema_strict:
    description: "Whether to enforce strict JSON schema mode"
    required: false
    default: "true"
  main_action:
    description: "Agent main_action"
    required: false
    default: "github_action"
  sub_action:
    description: "Agent sub_action"
    required: false
    default: "run"
  session_id:
    description: "Telemetry session_id override (optional). If empty, a unique GitHub run-based id is used."
    required: false
    default: ""
  tools_config_json:
    description: "JSON dict for ToolsConfig overrides"
    required: false
    default: "{\"exec_enabled\": true}"
  session_config_json:
    description: "JSON dict for SessionConfig overrides"
    required: false
    default: "{}"
  agent_config_json:
    description: "JSON dict for AgentConfig overrides"
    required: false
    default: "{}"
  agent_max_runtime_minutes:
    description: "Maximum runtime (minutes) for the agent run (0 = unlimited)"
    required: false
    default: "0"
  agent_max_cost_usd:
    description: "Maximum estimated spend for the agent run in USD (0 = unlimited)"
    required: false
    default: "0"
  logging_level:
    description: "Logging level"
    required: false
    default: "INFO"
  max_turns:
    description: "Session max_turns override (0 to keep default)"
    required: false
    default: "100"
  openai_api_key:
    description: "OpenAI API key (optional, prefer env OPENAI_API_KEY)"
    required: false
    default: ""
  openrouter_api_key:
    description: "OpenRouter API key (optional, prefer env OPENROUTER_API_KEY)"
    required: false
    default: ""
  openrouter_http_referer:
    description: "OpenRouter HTTP referer (optional)"
    required: false
    default: ""
  openrouter_app_name:
    description: "OpenRouter app name (optional)"
    required: false
    default: ""
  openrouter_base_url:
    description: "OpenRouter base URL (optional)"
    required: false
    default: ""
  gemini_api_key:
    description: "Gemini API key (optional, prefer env GEMINI_API_KEY)"
    required: false
    default: ""
  google_api_key:
    description: "Google API key for Gemini (optional, prefer env GOOGLE_API_KEY)"
    required: false
    default: ""
  anthropic_api_key:
    description: "Anthropic API key (optional, prefer env ANTHROPIC_API_KEY)"
    required: false
    default: ""
  claude_api_key:
    description: "Anthropic API key alias (optional, prefer env CLAUDE_API_KEY)"
    required: false
    default: ""
outputs:
  final-message:
    description: "Agent output"
    value: ${{ steps.run.outputs.final-message }}
runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install chack-agent
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e "${{ github.action_path }}"
    - name: Run chack-agent
      id: run
      shell: bash
      env:
        INPUT_PROVIDER: ${{ inputs.provider }}
        INPUT_MODEL_PRIMARY: ${{ inputs.model_primary }}
        INPUT_MODEL_SOCIAL: ${{ inputs.model_social_network }}
        INPUT_MODEL_SCIENTIFIC: ${{ inputs.model_scientific }}
        INPUT_MODEL_WEBSEARCHER: ${{ inputs.model_websearcher }}
        INPUT_MODEL_TESTER: ${{ inputs.model_tester }}
        INPUT_SYSTEM_PROMPT: ${{ inputs.system_prompt }}
        INPUT_USER_PROMPT: ${{ inputs.user_prompt }}
        INPUT_PROMPT_FILE: ${{ inputs.prompt_file }}
        INPUT_OUTPUT_SCHEMA_FILE: ${{ inputs.output_schema_file }}
        INPUT_OUTPUT_SCHEMA_JSON: ${{ inputs.output_schema_json }}
        INPUT_OUTPUT_SCHEMA_NAME: ${{ inputs.output_schema_name }}
        INPUT_OUTPUT_SCHEMA_STRICT: ${{ inputs.output_schema_strict }}
        INPUT_MAIN_ACTION: ${{ inputs.main_action }}
        INPUT_SUB_ACTION: ${{ inputs.sub_action }}
        INPUT_SESSION_ID: ${{ inputs.session_id }}
        INPUT_TOOLS_CONFIG_JSON: ${{ inputs.tools_config_json }}
        INPUT_SESSION_CONFIG_JSON: ${{ inputs.session_config_json }}
        INPUT_AGENT_CONFIG_JSON: ${{ inputs.agent_config_json }}
        INPUT_AGENT_MAX_RUNTIME_MINUTES: ${{ inputs.agent_max_runtime_minutes }}
        INPUT_AGENT_MAX_COST_USD: ${{ inputs.agent_max_cost_usd }}
        INPUT_LOGGING_LEVEL: ${{ inputs.logging_level }}
        INPUT_MAX_TURNS: ${{ inputs.max_turns }}
        INPUT_OPENAI_API_KEY: ${{ inputs.openai_api_key }}
        INPUT_OPENROUTER_API_KEY: ${{ inputs.openrouter_api_key }}
        INPUT_OPENROUTER_HTTP_REFERER: ${{ inputs.openrouter_http_referer }}
        INPUT_OPENROUTER_APP_NAME: ${{ inputs.openrouter_app_name }}
        INPUT_OPENROUTER_BASE_URL: ${{ inputs.openrouter_base_url }}
        INPUT_GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
        INPUT_GOOGLE_API_KEY: ${{ inputs.google_api_key }}
        INPUT_ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        INPUT_CLAUDE_API_KEY: ${{ inputs.claude_api_key }}
      working-directory: ${{ github.workspace }}
      run: |
        python -m chack_agent.github_action
