services:
  qdrant:
    image: qdrant/qdrant:v1.15.4
    container_name: chack-qdrant
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - ${CHACK_QDRANT_DATA_DIR:-/home/tester/.local/share/chack-agent/qdrant}:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
